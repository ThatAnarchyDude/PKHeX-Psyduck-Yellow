name: Android save editor
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Reuse a successful APK build run for runtime checks (optional)
        required: false
        default: ""
  push:
    paths: ['Android/EditorModel/**', 'Android/EditorProbe/**', 'Android/PsyduckSaveEditor/**', 'Android/scripts/**', '.github/workflows/android-editor.yml']
jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.build_run == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Android workload
        run: dotnet workload install android --skip-manifest-update
      - name: Verify workload package signatures
        run: python3 Android/scripts/verify_workload.py
      - name: Install checksum-verified SDK and JDK
        run: python3 Android/scripts/install_sdk.py
      - name: Build signed development APK
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/.tools/android-sdk
          JAVA_HOME: ${{ github.workspace }}/.tools/jdk/jdk-21.0.12.1+1
        run: python3 Android/scripts/build.py
      - name: Generate synthetic save for document-provider tests
        run: dotnet run --project Android/EditorProbe -c Release -- --create-fixture Android/artifacts/synthetic-test.sav
      - uses: actions/upload-artifact@v4
        with:
          name: Psyduck-Save-Editor-Android-experimental
          path: |
            Android/artifacts/Psyduck-Save-Editor-*.apk
            Android/artifacts/synthetic-test.sav
  android-launch:
    needs: build
    if: always() && !cancelled() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.build_run != ''))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: Psyduck-Save-Editor-Android-experimental
          path: Android/artifacts
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run || github.run_id }}
      - name: Enable Android hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 launch and file-picker check
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: python3 Android/scripts/smoke_android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-16-launch-evidence
          path: |
            Android/artifacts/smoke/*.png
            Android/artifacts/smoke/*.xml
            Android/artifacts/smoke/*.txt
